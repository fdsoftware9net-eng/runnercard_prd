<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <title>Loading...</title>
</head>
<body>
  <script>
    // LINE's LIFF Endpoint URL setting rejects any URL containing "#", but this
    // app's router is hash-based (HashRouter) so existing distributed links
    // (admin share links, emails already sent to runners) all use "/#/...".
    // This static page is registered as the LIFF Endpoint URL instead, and
    // forwards into the SPA's hash router.
    //
    // The query string must stay BEFORE the "#", because that is the only place
    // the LIFF SDK looks for its own parameters (liff.state, and the code/state
    // pair handed back after login). Moving them into the hash makes
    // liff.init() unable to establish the session, so it falls through to
    // liff.login() and the login callback never completes — which surfaces as
    // "400 Bad Request" on LINE's login screen.
    //
    // Whether we are running as a LIFF app is decided at runtime by
    // liff.isInClient(), not by anything in this URL.
    window.location.replace('/' + window.location.search + '#/lookup');
  </script>
</body>
</html>
